<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeev FIEB Theme - Demonstrador & Mock Real v0.2.1</title>
  <script type="module" src="./src/main.tsx"></script>
  <style>
    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
  </style>
</head>
<body>

  <!-- Contêiner Real Confirmado no h-Zeev -->
  <div id="containerRequest">
    <div class="page-title">
      <h1>Solicitar registro</h1>
    </div>
    
    <div id="ContainerForm">
      <div id="BoxFrmExecute">
        
        <table id="FrmExecute" style="width: 100%; border-collapse: separate; border-spacing: 0;">
          <tbody>
            <tr>
              <td>
                
                <!-- Agrupamento Dados Pessoais (data-groupid="7724") -->
                <table class="form" id="Dados pessoais" data-groupid="7724" style="width: 100%;">
                  <tbody>
                    
                    <!-- Título do Agrupamento -->
                    <tr class="group">
                      <td colspan="2" class="group">
                        <b id="group7724" data-key="7724">Dados pessoais</b>
                      </td>
                    </tr>

                    <!-- 1. Nome completo (nomeCompleto) - TEXT INPUT -->
                    <tr codgroup="7724" class="execute-required">
                      <td id="td0nomeCompleto" class="col0">Nome completo</td>
                      <td id="td1nomeCompleto" class="col1" fieldkey="56955">
                        <input
                          type="text"
                          name="inp56955"
                          id="inpnomeCompleto"
                          data-name="nomeCompleto"
                          data-label="Nome completo"
                          data-required="true"
                          data-fieldformat="TEXT"
                          label="Nome completo"
                          xname="inpnomeCompleto"
                          xtype="TEXT"
                          required="S"
                          autocomplete="off"
                          class="form-control form-control-text"
                          value="">
                      </td>
                    </tr>

                    <!-- 2. CPF (cpfCliente) - TEXT INPUT COM MENSAGEM AUXILIAR -->
                    <tr codgroup="7724" class="execute-required">
                      <td id="td0cpfCliente" class="col0">CPF</td>
                      <td id="td1cpfCliente" class="col1" fieldkey="56956">
                        <input
                          type="text"
                          name="inp56956"
                          id="inpcpfCliente"
                          data-name="cpfCliente"
                          data-label="CPF"
                          data-required="true"
                          data-fieldformat="TEXT"
                          class="form-control form-control-text"
                          value="">
                        <span class="form-text text-muted small">máscara 000.000.000-00</span>
                      </td>
                    </tr>

                    <!-- 3. Nacionalidade (nacionalidade) - TEXT INPUT -->
                    <tr codgroup="7724">
                      <td id="td0nacionalidade" class="col0">Nacionalidade</td>
                      <td id="td1nacionalidade" class="col1" fieldkey="56957">
                        <input
                          type="text"
                          name="inp56957"
                          id="inpnacionalidade"
                          data-name="nacionalidade"
                          data-label="Nacionalidade"
                          data-fieldformat="TEXT"
                          class="form-control form-control-text"
                          value="">
                      </td>
                    </tr>

                    <!-- 4. Estado civil (estadoCivil) - RADIO GROUP DE SELEÇÃO ÚNICA -->
                    <tr codgroup="7724">
                      <td id="td0estadoCivil" class="col0">Estado civil</td>
                      <td id="td1estadoCivil" class="col1" fieldkey="56958">
                        <div class="form-check">
                          <input type="radio" name="estadoCivil" id="radio_ec_1" data-name="estadoCivil" data-fieldformat="RADIO" value="solteiro" class="form-check-input" checked>
                          <label for="radio_ec_1" class="form-check-label">Solteiro(a)</label>
                        </div>
                        <div class="form-check">
                          <input type="radio" name="estadoCivil" id="radio_ec_2" data-name="estadoCivil" data-fieldformat="RADIO" value="casado" class="form-check-input">
                          <label for="radio_ec_2" class="form-check-label">Casado(a)</label>
                        </div>
                        <div class="form-check">
                          <input type="radio" name="estadoCivil" id="radio_ec_3" data-name="estadoCivil" data-fieldformat="RADIO" value="divorciado" class="form-check-input">
                          <label for="radio_ec_3" class="form-check-label">Divorciado(a)</label>
                        </div>
                        <div class="form-check">
                          <input type="radio" name="estadoCivil" id="radio_ec_4" data-name="estadoCivil" data-fieldformat="RADIO" value="viuvo" class="form-check-input">
                          <label for="radio_ec_4" class="form-check-label">Viúvo(a)</label>
                        </div>
                      </td>
                    </tr>

                    <!-- 5. Profissão (profissao) - TEXT INPUT -->
                    <tr codgroup="7724">
                      <td id="td0profissao" class="col0">Profissão</td>
                      <td id="td1profissao" class="col1" fieldkey="56959">
                        <input
                          type="text"
                          name="inp56959"
                          id="inpprofissao"
                          data-name="profissao"
                          data-label="Profissão"
                          data-fieldformat="TEXT"
                          class="form-control form-control-text"
                          value="">
                      </td>
                    </tr>

                    <!-- 6. Tipo de documento (tipoDocumento) - RADIO GROUP DE SELEÇÃO ÚNICA -->
                    <tr codgroup="7724">
                      <td id="td0tipoDocumento" class="col0">Tipo de documento</td>
                      <td id="td1tipoDocumento" class="col1" fieldkey="56960">
                        <div class="form-check">
                          <input type="radio" name="tipoDocumento" id="radio_td_1" data-name="tipoDocumento" data-fieldformat="RADIO" value="cin" class="form-check-input">
                          <label for="radio_td_1" class="form-check-label">CIN</label>
                        </div>
                        <div class="form-check">
                          <input type="radio" name="tipoDocumento" id="radio_td_2" data-name="tipoDocumento" data-fieldformat="RADIO" value="rg" class="form-check-input" checked>
                          <label for="radio_td_2" class="form-check-label">RG</label>
                        </div>
                        <div class="form-check">
                          <input type="radio" name="tipoDocumento" id="radio_td_3" data-name="tipoDocumento" data-fieldformat="RADIO" value="cnh" class="form-check-input">
                          <label for="radio_td_3" class="form-check-label">CNH</label>
                        </div>
                        <div class="form-check">
                          <input type="radio" name="tipoDocumento" id="radio_td_4" data-name="tipoDocumento" data-fieldformat="RADIO" value="passaporte" class="form-check-input">
                          <label for="radio_td_4" class="form-check-label">Passaporte</label>
                        </div>
                      </td>
                    </tr>

                    <!-- 7. Número do documento (numeroDocumento) - TEXT INPUT -->
                    <tr codgroup="7724">
                      <td id="td0numeroDocumento" class="col0">Número do documento</td>
                      <td id="td1numeroDocumento" class="col1" fieldkey="56961">
                        <input
                          type="text"
                          name="inp56961"
                          id="inpnumeroDocumento"
                          data-name="numeroDocumento"
                          data-label="Número do documento"
                          data-fieldformat="TEXT"
                          class="form-control form-control-text"
                          value="">
                      </td>
                    </tr>

                  </tbody>
                </table>

              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>

    <!-- Barra de Controles e Botão Real Confirmados (#controllers / #buttons / #BtnSend) -->
    <div id="controllers">
      <div id="buttons">
        <button
          class="btn btn-success btn-mobile"
          id="BtnSend"
          type="button"
          onclick="alert('Ação de simulação local')">
          Enviar solicitação
        </button>
      </div>
    </div>

  </div>

</body>
</html>
