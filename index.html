<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeev FIEB Theme - Visualizador Local & Descoberta do DOM v0.1.0</title>
  <link rel="stylesheet" href="./dist/zeev-fieb.css">
  <style>
    body {
      background-color: #f1f5f9;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .preview-container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .preview-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #004085;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #cbd5e1;
    }
    table.zeev-table-preview {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 12px;
    }
    table.zeev-table-preview td.col0 {
      width: 25%;
      padding-right: 12px;
    }
  </style>
</head>
<body>

  <div class="preview-container">
    
    <div class="preview-title">
      Treinamento - Otávio Katibe (Descoberta do DOM h-Zeev v0.1.0)
    </div>

    <table class="zeev-table-preview">
      <tbody>

        <!-- 1. Nome completo (DOM REAL CONFIRMADO NO h-ZEEV) -->
        <tr codgroup="7724" class="execute-required">
          <td valign="top" id="td0nomeCompleto" class="col0">
            Nome completo
          </td>
          <td valign="top" id="td1nomeCompleto" class="col1" fieldkey="56955">
            <textarea
              rows="5"
              name="inp56955"
              id="inpnomeCompleto"
              data-name="nomeCompleto"
              data-label="Nome completo"
              data-required="true"
              data-fieldformat="TEXTAREA"
              label="Nome completo"
              xname="inpnomeCompleto"
              xtype="TEXTAREA"
              required="S"
              autocomplete="off"
              class="form-control form-control-textarea">Otávio Katibe</textarea>
          </td>
        </tr>

        <!-- 2. CPF (cpfCliente) - Hipótese -->
        <tr>
          <td valign="top" class="col0">CPF</td>
          <td valign="top" class="col1">
            <input type="text" id="inpcpfCliente" data-name="cpfCliente" class="form-control" value="123.456.789-00">
          </td>
        </tr>

        <!-- 3. Nacionalidade (nacionalidade) - Hipótese -->
        <tr>
          <td valign="top" class="col0">Nacionalidade</td>
          <td valign="top" class="col1">
            <textarea id="inpnacionalidade" data-name="nacionalidade" class="form-control">Brasileira</textarea>
          </td>
        </tr>

        <!-- 4. Estado civil (estadoCivil) - Hipótese -->
        <tr>
          <td valign="top" class="col0">Estado civil</td>
          <td valign="top" class="col1">
            <select id="inpestadoCivil" data-name="estadoCivil" class="form-control">
              <option value="">Selecione...</option>
              <option value="solteiro" selected>Solteiro(a)</option>
              <option value="casado">Casado(a)</option>
            </select>
          </td>
        </tr>

        <!-- 5. Profissão (profissao) - Hipótese -->
        <tr>
          <td valign="top" class="col0">Profissão</td>
          <td valign="top" class="col1">
            <textarea id="inpprofissao" data-name="profissao" class="form-control">Analista de Sistemas</textarea>
          </td>
        </tr>

        <!-- 6. Tipo de documento (tipoDocumento) - Hipótese -->
        <tr>
          <td valign="top" class="col0">Tipo de documento</td>
          <td valign="top" class="col1">
            <select id="inptipoDocumento" data-name="tipoDocumento" class="form-control">
              <option value="rg" selected>RG - Carteira de Identidade</option>
            </select>
          </td>
        </tr>

        <!-- 7. Número do documento (numeroDocumento) - Hipótese -->
        <tr>
          <td valign="top" class="col0">Número do documento</td>
          <td valign="top" class="col1">
            <textarea id="inpnumeroDocumento" data-name="numeroDocumento" class="form-control">12.345.678-9 SSP/BA</textarea>
          </td>
        </tr>

      </tbody>
    </table>

  </div>

</body>
</html>
